# /etc/nginx/sites-available/wow.chille.sh
# Enable: sudo ln -s /etc/nginx/sites-available/wow.chille.sh /etc/nginx/sites-enabled/
# Certificate: sudo certbot --nginx -d wow.chille.sh   (fills in the ssl_ lines)

server {
    listen 80;
    listen [::]:80;
    server_name wow.chille.sh;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name wow.chille.sh;

    ssl_certificate     /etc/letsencrypt/live/wow.chille.sh/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/wow.chille.sh/privkey.pem;

    add_header Strict-Transport-Security "max-age=31536000" always;
    client_max_body_size 32k;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }
}
